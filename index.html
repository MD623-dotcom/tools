<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工具箱</title>
<meta name="description" content="自己寫的小工具與報表。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工具箱">
<meta property="og:type" content="website">
<meta property="og:title" content="工具箱">
<meta property="og:description" content="自己寫的小工具與報表。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='%236ea8fe'%3E%3Crect x='8' y='8' width='20' height='20' rx='5'/%3E%3Crect x='36' y='8' width='20' height='20' rx='5'/%3E%3Crect x='8' y='36' width='20' height='20' rx='5'/%3E%3Crect x='36' y='36' width='20' height='20' rx='5'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d0f14;
    --fg: #f2f4f8;
    --muted: #8b93a3;
    --accent: #6ea8fe;
    --card: rgba(255, 255, 255, 0.05);
    --card-hover: rgba(255, 255, 255, 0.1);
    --border: rgba(255, 255, 255, 0.08);
    --pill: rgba(110, 168, 254, 0.16);
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9;
    --fg: #14171d;
    --muted: #6b7280;
    --accent: #2563eb;
    --card: #ffffff;
    --card-hover: #ffffff;
    --border: rgba(0, 0, 0, 0.09);
    --pill: rgba(37, 99, 235, 0.1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: clamp(2rem, 7vw, 4.5rem) clamp(1.1rem, 5vw, 2rem) 3rem;
  }

  .wrap { max-width: 60rem; margin: 0 auto; }

  header { margin-bottom: clamp(1.8rem, 5vw, 3rem); }

  h1 {
    margin: 0 0 0.4rem;
    font-size: clamp(1.9rem, 6.5vw, 3rem);
    font-weight: 300;
    letter-spacing: -0.02em;
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: clamp(0.9rem, 3vw, 1.05rem);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: clamp(0.8rem, 2.5vw, 1.1rem);
  }

  .card {
    display: flex;
    gap: 0.9rem;
    align-items: flex-start;
    padding: 1.15rem 1.25rem;
    border-radius: 1rem;
    border: 1px solid var(--border);
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    background: var(--card-hover);
    border-color: var(--accent);
  }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .icon {
    flex: 0 0 auto;
    width: 2.4rem;
    height: 2.4rem;
    display: grid;
    place-items: center;
    font-size: 1.7rem;
    line-height: 1;
  }
  .icon svg { display: block; width: 100%; height: 100%; }

  .body { min-width: 0; }

  .name {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 0.2rem;
  }

  .tag {
    font-size: 0.68rem;
    font-weight: 500;
    color: var(--accent);
    background: var(--pill);
    padding: 0.15em 0.55em;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }

  .desc {
    margin: 0;
    font-size: 0.87rem;
    line-height: 1.5;
    color: var(--muted);
  }

  .empty {
    padding: 2.5rem 1rem;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 1rem;
  }

  footer {
    margin-top: clamp(2.5rem, 7vw, 4rem);
    padding-top: 1.3rem;
    border-top: 1px solid var(--border);
    font-size: 0.82rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>工具箱</h1>
    <p class="sub">自己寫的小工具與報表</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    原始碼在 <a href="https://github.com/MD623-dotcom/tools">github.com/MD623-dotcom/tools</a>
  </footer>

</div>

<script>
(function () {
  "use strict";

  /* ================================================================
     要新增工具，就在下面這個陣列加一筆，然後 git push。就這樣。

       name  工具名稱
       desc  一句話說明
       href  資料夾路徑，記得結尾加斜線，例如 "clock/"
       icon  emoji（例如 "⏰"）或一段內嵌 SVG 字串
       tag   可省略。顯示在名稱旁的小標籤，例如 "報表"

     新工具的做法：在 repo 裡開一個資料夾，裡面放 index.html，
     然後在這裡加一筆指向它。
     ================================================================ */

  var TOOLS = [
    {
      name: "時鐘",
      desc: "大字時鐘，含日期、星期與所在地即時天氣。可切換 12/24 小時制與深淺色。",
      href: "clock/",
      icon: '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" ' +
            'stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="32" cy="32" r="25"/><path d="M32 18v15l11 6"/></svg>',
      tag: "工具"
    }
  ];

  /* ---------- 以下不用改 ---------- */

  var grid = document.getElementById("grid");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  if (!TOOLS.length) {
    grid.className = "empty";
    grid.textContent = "還沒有工具。在 index.html 的 TOOLS 陣列裡加第一筆吧。";
  } else {
    TOOLS.forEach(function (t) {
      var a = document.createElement("a");
      a.className = "card";
      a.href = t.href;

      // icon 允許兩種寫法：以 "<" 開頭視為 SVG，否則當成 emoji 文字
      var iconHTML = t.icon && t.icon.charAt(0) === "<"
        ? t.icon
        : esc(t.icon || "🔧");

      a.innerHTML =
        '<span class="icon" style="color:var(--accent)" aria-hidden="true">' + iconHTML + "</span>" +
        '<span class="body">' +
          '<span class="name">' + esc(t.name) +
            (t.tag ? '<span class="tag">' + esc(t.tag) + "</span>" : "") +
          "</span>" +
          '<p class="desc">' + esc(t.desc || "") + "</p>" +
        "</span>";

      grid.appendChild(a);
    });
  }

  // 主題跟隨系統
  function applyTheme() {
    document.documentElement.setAttribute(
      "data-theme",
      window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
    );
  }
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  applyTheme();
})();
</script>
</body>
</html>
